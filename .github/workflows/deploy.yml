name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            # Upgrade Node.js if needed (Next.js 16 requires >= 20)
            NODE_VER=$(node --version 2>/dev/null | cut -d'v' -f2 | cut -d'.' -f1 || echo 0)
            if [ "$NODE_VER" -lt 20 ]; then
              echo "⚠ Node.js $NODE_VER is too old, upgrading to v22..."
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
              echo "✅ Node.js upgraded to $(node --version)"
            fi

            # Pull latest code
            cd /root/blog
            git pull origin main

            # Install & build
            npm ci --production=false
            npm run build

            # Create logs directory
            mkdir -p logs

            # Restart PM2
            pm2 reload blog 2>/dev/null || pm2 start ecosystem.config.js
            pm2 save
            pm2 startup systemd -u root --hp /root 2>/dev/null || true

            # Ensure Nginx is running
            if ! which nginx >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y nginx
            fi
            cp /root/blog/nginx.conf /etc/nginx/sites-available/blog
            ln -sf /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && (systemctl reload nginx || nginx -s reload || systemctl start nginx)

            echo "✅ Deploy complete! Visit https://x1anyu.top"
