name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_timeout: 300s
          script: |
            set -e
            echo "=== Starting deployment ==="

            # Upgrade Node.js if needed
            NODE_VER=$(node --version 2>/dev/null | cut -d'v' -f2 | cut -d'.' -f1 || echo 0)
            echo "Current Node.js version: $NODE_VER"
            if [ "$NODE_VER" -lt 20 ]; then
              echo "Upgrading Node.js to v22..."
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
              hash -r
              echo "Node.js upgraded to: $(node --version)"
            fi

            # Pull latest code
            echo "=== Pulling latest code ==="
            cd /root/blog
            git pull origin main

            # Install & build
            echo "=== Installing dependencies ==="
            npm ci --production=false
            echo "=== Building ==="
            npm run build

            # Create logs dir
            mkdir -p logs

            # Restart PM2
            echo "=== Starting PM2 ==="
            pm2 delete blog 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save
            pm2 startup systemd -u root --hp /root 2>/dev/null || true

            # Ensure Nginx
            echo "=== Configuring Nginx ==="
            if ! command -v nginx >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y nginx
            fi
            cp /root/blog/nginx.conf /etc/nginx/sites-available/blog
            ln -sf /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
            nginx -t
            systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null || systemctl start nginx

            # Verify
            echo "=== Verifying ==="
            sleep 2
            curl -s -o /dev/null -w "localhost:3000 HTTP %{http_code}\n" http://localhost:3000 || true
            curl -s -o /dev/null -w "localhost:80 HTTPS %{http_code}\n" http://localhost || true
            pm2 list

            echo "✅ Deploy complete! https://x1anyu.top"
