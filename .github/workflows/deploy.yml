name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          tar czf deploy.tar.gz \
            .next \
            public \
            content \
            src \
            package.json \
            package-lock.json \
            ecosystem.config.js \
            nginx.conf \
            next.config.ts \
            tsconfig.json \
            postcss.config.mjs \
            eslint.config.mjs

      - name: Deploy to server
        uses: appleboy/scp-action@v0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: deploy.tar.gz
          target: /root/blog-tmp

      - name: Restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "=== Deploying ==="

            # Node upgrade if needed
            [ "$(node -v | cut -d. -f1 | tr -d v)" -lt 20 ] && curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs

            # Extract to blog dir
            rm -rf /root/blog-tmp
            mkdir -p /root/blog-tmp
            tar xzf /root/blog-tmp/deploy.tar.gz -C /root/blog-tmp/ || tar xzf /root/blog-tmp/deploy.tar.gz -C /root/blog-tmp/

            # Replace old build
            rm -rf /root/blog/.next /root/blog/public /root/blog/src /root/blog/content
            cp -r /root/blog-tmp/.next /root/blog/
            cp -r /root/blog-tmp/public /root/blog/ 2>/dev/null || true
            cp -r /root/blog-tmp/src /root/blog/ 2>/dev/null || true
            cp -r /root/blog-tmp/content /root/blog/ 2>/dev/null || true
            cp /root/blog-tmp/package.json /root/blog/ 2>/dev/null || true
            cp /root/blog-tmp/ecosystem.config.js /root/blog/ 2>/dev/null || true
            cp /root/blog-tmp/nginx.conf /root/blog/ 2>/dev/null || true

            # Install deps
            cd /root/blog && npm install --production 2>&1 | tail -3

            # Restart
            mkdir -p logs
            pm2 restart blog 2>/dev/null || pm2 start ecosystem.config.js
            pm2 save

            # Nginx
            cp /root/blog/nginx.conf /etc/nginx/sites-available/blog
            ln -sf /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && nginx -s reload 2>/dev/null || (nginx && echo nginx-started)

            # Clean
            rm -rf /root/blog-tmp

            sleep 2
            curl -sI http://localhost:3000 | head -3
            echo "=== Done ==="
