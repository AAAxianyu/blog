name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, test and build
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Create release archive
        run: |
          set -euo pipefail
          mkdir -p release/.next release/seed-posts release/ops
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp -a public release/public
          cp -a content/posts/. release/seed-posts/
          cp ops/x1anyu-blog.service release/ops/
          cp nginx.conf release/ops/
          tar -C release -czf "blog-${GITHUB_SHA}.tgz" .

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          sshpass -e scp "blog-${GITHUB_SHA}.tgz" \
            "$SSH_USERNAME@$SSH_HOST:/tmp/blog-${GITHUB_SHA}.tgz"

      - name: Activate release with rollback
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          sshpass -e ssh "$SSH_USERNAME@$SSH_HOST" \
            "bash -s -- '${GITHUB_SHA}'" < ops/activate-release.sh

      - name: Verify public endpoint
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 \
            --resolve "x1anyu.top:443:${SSH_HOST}" \
            "https://x1anyu.top/api/health"
