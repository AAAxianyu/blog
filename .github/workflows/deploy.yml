name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_timeout: 600s
          script: |
            set -e
            echo "===== Deploy start: $(date) ====="

            # Ensure swap exists (build needs ~1GB RAM)
            if [ ! -f /swapfile ]; then
              echo "Creating 1GB swap..."
              dd if=/dev/zero of=/swapfile bs=1M count=1024 2>/dev/null
              chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
              echo "/swapfile swap swap defaults 0 0" >> /etc/fstab
            fi

            # Upgrade Node if < v20
            NV=$(node -v 2>/dev/null | cut -d. -f1 | tr -d 'v')
            if [ "${NV:-0}" -lt 20 ]; then
              echo "Node v$NV -> upgrading to v22..."
              apt-get update -qq
              apt-get install -y ca-certificates curl gnupg
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
              hash -r
            fi
            echo "Node: $(node -v) | NPM: $(npm -v)"

            # Clone or update
            if [ -d /root/blog/.git ]; then
              cd /root/blog
              git fetch https://github.com/AAAxianyu/blog.git main
              git reset --hard FETCH_HEAD
            else
              rm -rf /root/blog
              git clone https://github.com/AAAxianyu/blog.git /root/blog
              cd /root/blog
            fi

            # Build
            npm install
            NODE_OPTIONS="--max-old-space-size=512" npm run build

            # PM2
            mkdir -p logs
            pm2 delete blog 2>/dev/null || true
            pm2 start ecosystem.config.js
            pm2 save

            # Nginx
            cp nginx.conf /etc/nginx/sites-available/blog
            ln -sf /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
            if ! nginx -t 2>/dev/null; then
              apt-get install -y nginx
              nginx -t
            fi
            systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null || systemctl start nginx

            # Verify
            sleep 3
            echo "--- localhost:3000 ---"
            curl -sI http://localhost:3000 2>&1 | head -3 || echo "DOWN"
            echo "--- localhost:80 ---"
            curl -sI http://localhost 2>&1 | head -3 || echo "DOWN"
            pm2 list
            echo "===== Deploy done: $(date) ====="
