name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Package
        run: tar czf deploy.tar.gz .next public content src package.json package-lock.json ecosystem.config.js nginx.conf next.config.ts tsconfig.json postcss.config.mjs eslint.config.mjs

      - name: Upload via SCP
        uses: appleboy/scp-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: deploy.tar.gz
          target: /root/blog-tmp

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 600s
          script: |
            set -e
            echo "=== Upgrade Node if needed ==="

            if [ "$(node -v | cut -d. -f1 | tr -d v)" -lt 20 ]; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
            fi

            echo "=== Extract ==="
            cd /root/blog-tmp && tar xzf deploy.tar.gz

            echo "=== Sync to blog ==="
            rm -rf /root/blog/.next /root/blog/content /root/blog/src /root/blog/public
            cp -r .next /root/blog/
            cp -r content /root/blog/ 2>/dev/null || true
            cp -r src /root/blog/ 2>/dev/null || true
            cp -r public /root/blog/ 2>/dev/null || true
            cp package.json package-lock.json ecosystem.config.js nginx.conf /root/blog/ 2>/dev/null || true

            echo "=== Install deps ==="
            cd /root/blog && npm install --production 2>&1 | tail -3

            echo "=== PM2 ==="
            mkdir -p logs
            pm2 restart blog 2>/dev/null || pm2 start ecosystem.config.js
            pm2 save

            echo "=== Nginx ==="
            cp /root/blog/nginx.conf /etc/nginx/sites-available/blog
            ln -sf /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
            rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
            nginx -t
            nginx -s reload 2>/dev/null || (nginx && echo nginx-started)

            rm -rf /root/blog-tmp

            sleep 2
            curl -sI http://localhost:3000 | head -3
            echo "=== Done ==="
