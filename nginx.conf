# Nginx configuration for x1anyu.top
# Place this at /etc/nginx/sites-available/blog and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name x1anyu.top www.x1anyu.top;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets (cached)
    location /_next/static {
        alias /root/blog/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /public {
        alias /root/blog/public;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Feed and sitemap
    location /feed.xml {
        proxy_pass http://127.0.0.1:3000;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Proxy all other requests to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
